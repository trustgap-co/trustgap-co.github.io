name = "trustgap-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "trustgap"
database_id = "ebea18ed-ac3c-42de-88b8-8d2c75e223e4"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

# Non-secret settings. Secrets (APP_SECRET, ADMIN_PASSWORD, FLW_SECRET_KEY, ...) are set with
# `npx wrangler secret put NAME` — never put them in this file. See ../SETUP.md.
[vars]
TEST_MODE = "true"
SITE_URL = "https://trustgap-co.github.io"
API_URL = "https://trustgap-api.trustgap-co.workers.dev"
ALLOWED_ORIGINS = "https://trustgap-co.github.io"
PAYMENT_PROVIDER = "mock"
IDENTITY_PROVIDER = "mock"        # "monnify" once MONNIFY_API_KEY / MONNIFY_SECRET_KEY are set
LOGISTICS_PROVIDER = "manual"      # "fez" once FEZ_USER_ID / FEZ_PASSWORD are set
FEZ_API_BASE = "https://apisandbox.fezdelivery.co/v1"
REQUIRE_SELLER_ID = "true"
FEE_PERCENT = "1.5"               # TrustGap fee
FEE_MIN_NAIRA = "100"
FEE_CAP_NAIRA = "3000"            # TrustGap fee never more than this per deal (0 = no cap)
PROCESSING_CAP_NAIRA = "2000"     # Flutterwave's cap on its percentage per payment (0 = no cap)
PROCESSING_PERCENT = "2"          # Flutterwave on local NGN collections
PAYOUT_FEE_NAIRA = "57.79"        # Flutterwave transfer fee ₦53.75 + 7.5% VAT
SETTLEMENT_HOURS = "24"           # Flutterwave settles T+1; payouts wait for it
MAX_DEAL_NAIRA = "300000"
INSPECTION_HOURS = "24"
PROMO_CODE = "EARLYGAP"           # early-access code: no TrustGap fee on one deal ("" switches it off)
PROMO_ENDS = "2027-01-31"         # last day the code works (Lagos time)
PROMO_MAX_USES = "1000"           # total deals/orders it can be used on
