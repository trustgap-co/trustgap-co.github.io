name = "trustgap-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "trustgap"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

# Non-secret settings. Secrets (APP_SECRET, ADMIN_PASSWORD, FLW_SECRET_KEY, ...) are set with
# `npx wrangler secret put NAME` — never put them in this file. See ../SETUP.md.
[vars]
TEST_MODE = "true"
SITE_URL = "https://trustgap-co.github.io"
API_URL = "https://trustgap-api.YOUR-SUBDOMAIN.workers.dev"
ALLOWED_ORIGINS = "https://trustgap-co.github.io"
PAYMENT_PROVIDER = "mock"
IDENTITY_PROVIDER = "mock"        # "monnify" once MONNIFY_API_KEY / MONNIFY_SECRET_KEY are set
LOGISTICS_PROVIDER = "manual"
REQUIRE_SELLER_ID = "true"
FEE_PERCENT = "1.5"               # TrustGap fee (no cap)
FEE_MIN_NAIRA = "100"
PROCESSING_PERCENT = "2"          # Flutterwave on local NGN collections
PAYOUT_FEE_NAIRA = "57.79"        # Flutterwave transfer fee ₦53.75 + 7.5% VAT
SETTLEMENT_HOURS = "24"           # Flutterwave settles T+1; payouts wait for it
MAX_DEAL_NAIRA = "1000000"
INSPECTION_HOURS = "24"
